[build-system]
requires=["setuptools>=68","wheel"]
build-backend="setuptools.backends.legacy:build"
[project]
name="data-encryption-decryption"
version="1.0.0"
description="AES-256-GCM, RSA-2048, HMAC-SHA256 cryptographic utilities"
readme="README.md"
license={text="MIT"}
requires-python=">=3.10"
authors=[{name="Jaimin Babariya",email="jaiminbabariya7@gmail.com"}]
keywords=["cryptography","aes","rsa","security"]
dependencies=["cryptography>=41.0"]
[project.optional-dependencies]
dev=["pytest>=7.4","pytest-cov>=4.1","black>=23.0"]
[tool.pytest.ini_options]
testpaths=["tests"]
addopts="-v --tb=short"